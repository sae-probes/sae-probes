[project]
name = "sae-probes"
dynamic = ["version"]
description = "Sparse probing benchmark for Sparse Autoencoders derived from the paper \"Are Sparse Autoencoders Useful? A Case Study in Sparse Probing\""
authors = [{ name = "Subhash Kantamneni" }, { name = "Joshua Engels" }]
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10,<4.0"
keywords = [
    "deep-learning",
    "sparse-autoencoders",
    "mechanistic-interpretability",
    "PyTorch",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "transformer-lens>=2.15.4,<4.0.0",
    "sae-lens>=5.0.0,<7.0.0",
    "scikit-learn>=1.6.1,<2.0.0",
    "pandas>=2.2.3,<3.0.0",
    "xgboost>=3.0.2,<4.0.0",
    "hf-transfer>=0.1.9,<0.2.0",
    "zstandard>=0.19.0",
    # transformer-lens 2.x pins numpy<2, but pyarrow>=26 requires numpy>=2 at import time
    # without declaring it as a dependency, so resolvers can pick an incompatible pair
    "pyarrow<26",
]

[project.urls]
Homepage = "https://github.com/sae-probes/sae-probes"
Repository = "https://github.com/sae-probes/sae-probes"

[dependency-groups]
dev = [
    "pytest>=8.3.5,<9.0.0",
    "pytest-xdist>=3.6.1,<4.0.0",
    "ruff>=0.11.11,<0.12.0",
    "pyright>=1.1.401,<2.0.0",
    "matplotlib>=3.10.5,<4.0.0",
]


[tool.isort]
profile = "black"

[tool.ruff]
exclude = ["dist", "docs", "*.ipynb", "tests/_comparison"]

[tool.ruff.lint]
ignore = ["E203", "E501", "E731"]
extend-select = ["UP", "TID", "I", "F", "E", "ARG"]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"typing.Union".msg = "Use `|` instead"
"typing.Optional".msg = "Use `| None` instead"
"typing.Dict".msg = "Use `dict` instead"
"typing.Tuple".msg = "Use `tuple` instead"
"typing.List".msg = "Use `list` instead"

[tool.pyright]
typeCheckingMode = "basic"
ignore = ["tests/_comparison"]
reportPrivateImportUsage = false

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "sae_probes/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["sae_probes"]
core-metadata-version = "2.4"

[tool.hatch.build.targets.sdist]
include = ["/sae_probes", "/README.md", "/LICENSE", "/pyproject.toml"]
core-metadata-version = "2.4"

[tool.semantic_release]
version_variables = ["sae_probes/__init__.py:__version__"]
build_command = "pip install uv && uv build"
branches = { main = { match = "main" }, alpha = { match = "alpha", prerelease = true }, beta = { match = "beta", prerelease = true } }
